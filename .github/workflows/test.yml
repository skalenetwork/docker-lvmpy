name: Test
on: [push]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check
      - name: Run tests
        run: sudo env "PATH=$PWD/.venv/bin:$PATH" ./tests/run-tests.sh
