name: Publish
on:
  pull_request:
    types: [closed]
    branches: [develop, beta, stable]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - id: version
        env:
          BRANCH: ${{ github.base_ref }}
        run: |
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$BRANCH" = stable ]; then echo "tag=$base" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --quiet --tags
          n=0
          while git rev-parse --quiet --verify "refs/tags/$base-$BRANCH.$n" >/dev/null; do n=$((n + 1)); done
          echo "tag=$base-$BRANCH.$n" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          prerelease: ${{ github.base_ref != 'stable' }}
