[project]
name = "docker-lvmpy"
version = "2.1.0"
requires-python = ">=3.14"
dependencies = ["Flask==3.1.3", "requests==2.34.2"]

[project.optional-dependencies]
dev = ["ruff==0.17.3"]
test = ["docker==7.2.0", "pytest==9.2.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
